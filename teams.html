<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Teams Message Broadcaster</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 40px;
  }

  .container {
    max-width: 750px;
    margin: auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    padding: 30px;
  }

  h2 {
    margin-top: 0;
    color: #2c3e50;
  }

  label {
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    height: 200px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ced4da;
    font-size: 14px;
    white-space: pre-wrap;
  }

  button {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
  }

  button:disabled {
    background: #adb5bd;
    cursor: not-allowed;
  }

  .info-bar {
    margin-top: 15px;
    font-size: 13px;
    background: #f1f3f5;
    padding: 12px;
    border-radius: 8px;
    color: #495057;
  }

  pre {
    margin-top: 15px;
    background: #0f172a;
    color: #e5e7eb;
    padding: 16px;
    border-radius: 8px;
    max-height: 300px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.5;
  }

  .footer {
    margin-top: 15px;
    font-size: 12px;
    color: #868e96;
    text-align: center;
  }
</style>
</head>

<body>

<div class="container">
  <h2>📨 Teams Message Broadcaster</h2>

  <label>Enter / Paste Message (format will be preserved)</label>
  <textarea id="message">
Please enter your message here to send :-
  </textarea>

  <button id="sendBtn" onclick="postMessageToAllChats()">Send Messages</button>

  <div class="info-bar">
    ⏱ Interval: <b>20 seconds</b><br>
    🔁 Duplicate chat IDs automatically ignored<br>
    ✅ Message formatting preserved
  </div>

  <pre id="result"></pre>

  <div class="footer">
    Microsoft Graph · Teams Automation
  </div>
</div>

<script>
  // Chat IDs (duplicates allowed)
  const chatIds = [
    "19:7e7884e8f91b44688abd04248059d6df@thread.v2",
    "19:b198bc30932449dda51e0c98f12d7acc@thread.v2",
    "19:6fd6aca16b174d52a98b6c05a4889aa4@thread.v2",
    "19:b198bc30932449dda51e0c98f12d7acc@thread.v2",
    "19:76b486fe21534593a8ae2f807bdf3763@thread.v2",
    "19:fdfcfe8c047c4b8c8d0ab1edc0cf12b7@thread.v2",
    "19:30abb03b721e40848385aff0f3de9682@thread.v2",
    "19:72952e091843483e99923873d4d21d5b@thread.v2",
    "19:72f5815879984f8ba6a0ce31eaec5262@thread.v2",
    "19:0ae81eae913345e1b5cadba63dce9743@thread.v2",
    "19:2457f33d2a9840769f158563517cd6e6@thread.v2",
    "19:2457f33d2a9840769f158563517cd6e6@thread.v2",
    "19:6878afbc426843c8a131d9704826574e@thread.v2",
    "19:b198bc30932449dda51e0c98f12d7acc@thread.v2",
    "19:7e7884e8f91b44688abd04248059d6df@thread.v2",
    "19:7e7884e8f91b44688abd04248059d6df@thread.v2",
    "19:f0d51e6c983d4c019e794f13360f620a@thread.v2",
    "19:f0d51e6c983d4c019e794f13360f620a@thread.v2",
    "19:b198bc30932449dda51e0c98f12d7acc@thread.v2",
    "19:6fd6aca16b174d52a98b6c05a4889aa4@thread.v2",
    "19:30abb03b721e40848385aff0f3de9682@thread.v2",
    "19:6b460f3860df4514b6140c5149a09495@thread.v2",
    "19:76b486fe21534593a8ae2f807bdf3763@thread.v2"



    /*"19:f4a8c4f2ef2b45f68dfcbab99acd1279@thread.v2",
    "19:8cd2c2e9756c4ac898f38a0169feccb1@thread.v2",
    "19:a25df31b06354644979dee9f5f0c6f13@thread.v2",
    "19:f4a8c4f2ef2b45f68dfcbab99acd1279@thread.v2"
    */
  ];

  const uniqueChatIds = [...new Set(chatIds)];
  const BEARER_TOKEN = "Access token";

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  // ✅ Convert plain text → safe HTML (preserves line breaks)
  function convertTextToHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");
  }

  async function postMessageToAllChats() {
    const btn = document.getElementById("sendBtn");
    const resultBox = document.getElementById("result");
    const message = document.getElementById("message").value;

    btn.disabled = true;
    resultBox.textContent =
      `Unique Chats: ${uniqueChatIds.length}\nInterval: 20 seconds\n\n`;

    const htmlMessage = convertTextToHtml(message);

    for (let i = 0; i < uniqueChatIds.length; i++) {
      const chatId = uniqueChatIds[i];

      try {
        const response = await fetch(
          `https://graph.microsoft.com/v1.0/chats/${chatId}/messages`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${BEARER_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              body: {
                contentType: "html",
                content: htmlMessage
              }
            })
          }
        );

        if (response.ok) {
          resultBox.textContent += `✅ Message sent (${i + 1}/${uniqueChatIds.length})\n`;
        } else {
          const err = await response.text();
          resultBox.textContent += `❌ Failed ${chatId}\n${err}\n`;
        }

      } catch (err) {
        resultBox.textContent += `❌ Error: ${err.message}\n`;
      }

      if (i < uniqueChatIds.length - 1) {
        resultBox.textContent += `⏳ Waiting 20 seconds...\n\n`;
        await sleep(20000);
      }
    }

    resultBox.textContent += `\n🎉 All messages sent successfully`;
    btn.disabled = false;
  }
</script>

</body>
</html>
