<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teams Message Broadcaster</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --danger: #f85149;
    --warn: #d29922;
    --text: #e6edf3;
    --muted: #8b949e;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrapper {
    max-width: 820px;
    margin: auto;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  header .icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #1a73e8, #58a6ff);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    padding: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    align-items: center;
  }

  .toolbar button, .toolbar select, .toolbar input[type="color"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: 'DM Sans', sans-serif;
    line-height: 1.4;
  }

  .toolbar button:hover { background: var(--surface2); border-color: var(--accent); }
  .toolbar button.active { background: #1f3a5c; border-color: var(--accent); color: var(--accent); }

  .toolbar .sep {
    width: 1px; height: 22px;
    background: var(--border);
    flex-shrink: 0;
  }

  .toolbar input[type="color"] {
    width: 34px; height: 30px;
    padding: 3px 4px;
    cursor: pointer;
  }

  .toolbar label { font-size: 12px; color: var(--muted); }

  /* ── RICH EDITOR ── */
  #editor {
    width: 100%;
    min-height: 200px;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    line-height: 1.7;
    outline: none;
    transition: border-color 0.2s;
  }

  #editor:focus { border-color: var(--accent); }
  #editor:empty:before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }

  /* ── @EVERYONE BADGE ── */
  .at-everyone {
    display: inline-block;
    background: #1f3a5c;
    color: var(--accent);
    border-radius: 4px;
    padding: 0 5px;
    font-weight: 600;
    font-size: 0.9em;
    cursor: default;
    user-select: none;
  }

  /* ── CHAT IDs ── */
  #chatIds {
    width: 100%;
    min-height: 140px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.7;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
  }

  #chatIds:focus { border-color: var(--accent); }

  .hint {
    margin-top: 7px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── SETTINGS ROW ── */
  .settings-row {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }

  .setting-item { display: flex; flex-direction: column; gap: 4px; }
  .setting-item label { font-size: 12px; color: var(--muted); font-weight: 600; }

  .setting-item input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 14px;
    width: 100px;
    outline: none;
    font-family: 'IBM Plex Mono', monospace;
  }

  .setting-item input[type="number"]:focus { border-color: var(--accent); }

  /* ── TOKEN INPUT ── */
  .token-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #bearerToken {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    outline: none;
  }

  #bearerToken:focus { border-color: var(--accent); }

  .toggle-eye {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 15px;
  }

  /* ── BUTTONS ── */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .btn-send {
    background: linear-gradient(135deg, #1a73e8, #58a6ff);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-send:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-cancel {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    font-family: 'DM Sans', sans-serif;
    display: none;
  }

  .btn-cancel:hover { background: rgba(248, 81, 73, 0.1); }
  .btn-cancel.visible { display: block; }

  /* ── PROGRESS ── */
  .progress-wrap {
    margin-top: 8px;
    display: none;
  }

  .progress-wrap.visible { display: block; }

  .progress-bar-bg {
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    width: 100%;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a73e8, #58a6ff);
    border-radius: 99px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── LOG ── */
  #log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    min-height: 80px;
    max-height: 320px;
    overflow-y: auto;
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.8;
    color: var(--muted);
  }

  .log-ok   { color: var(--accent2); }
  .log-err  { color: var(--danger); }
  .log-wait { color: var(--warn); }
  .log-info { color: var(--accent); }
  .log-stop { color: var(--danger); font-weight: 600; }
  .log-done { color: var(--accent2); font-weight: 600; }
</style>
</head>
<body>

<div class="wrapper">

  <header>
    <div class="icon">📨</div>
    <div>
      <h1>Teams Broadcaster</h1>
      <p>Microsoft Graph · Bulk Chat Messaging Automation</p>
    </div>
  </header>

  <!-- MESSAGE COMPOSER -->
  <div class="card">
    <div class="card-title">✏️ &nbsp;Message Composer</div>

    <!-- Rich Text Toolbar -->
    <div class="toolbar">
      <button onclick="fmt('bold')" title="Bold"><b>B</b></button>
      <button onclick="fmt('italic')" title="Italic"><i>I</i></button>
      <button onclick="fmt('underline')" title="Underline"><u>U</u></button>
      <button onclick="fmt('strikeThrough')" title="Strikethrough"><s>S</s></button>
      <div class="sep"></div>
      <button onclick="insertEveryoneTag()" title="Mention Everyone" style="color:#58a6ff;font-weight:700;">@Everyone</button>
      <div class="sep"></div>
      <label>Color:</label>
      <input type="color" id="fontColor" value="#58a6ff" onchange="applyColor(this.value)" title="Font color">
      <div class="sep"></div>
      <button onclick="fmt('insertUnorderedList')" title="Bullet list">• List</button>
      <button onclick="fmt('insertOrderedList')" title="Numbered list">1. List</button>
      <div class="sep"></div>
      <button onclick="clearEditor()" title="Clear" style="color:var(--danger);">✕ Clear</button>
    </div>

    <!-- Editable rich-text div -->
    <div
      id="editor"
      contenteditable="true"
      data-placeholder="Type your message here… Use the toolbar for bold, colour, @Everyone etc."
    ></div>
  </div>

  <!-- CHAT IDs -->
  <div class="card">
    <div class="card-title">🔗 &nbsp;Chat IDs</div>
    <textarea id="chatIds" spellcheck="false" placeholder="Paste one Chat ID per line. Comment lines with // to skip them. Duplicates are ignored automatically.">19:7e7884e8f91b44688abd04248059d6df@thread.v2
19:b198bc30932449dda51e0c98f12d7acc@thread.v2
19:6fd6aca16b174d52a98b6c05a4889aa4@thread.v2
19:76b486fe21534593a8ae2f807bdf3763@thread.v2
19:fdfcfe8c047c4b8c8d0ab1edc0cf12b7@thread.v2
19:30abb03b721e40848385aff0f3de9682@thread.v2
19:72952e091843483e99923873d4d21d5b@thread.v2
19:72f5815879984f8ba6a0ce31eaec5262@thread.v2
19:0ae81eae913345e1b5cadba63dce9743@thread.v2
19:2457f33d2a9840769f158563517cd6e6@thread.v2
19:6878afbc426843c8a131d9704826574e@thread.v2
19:f0d51e6c983d4c019e794f13360f620a@thread.v2
19:6b460f3860df4514b6140c5149a09495@thread.v2
// 19:f4a8c4f2ef2b45f68dfcbab99acd1279@thread.v2
// 19:8cd2c2e9756c4ac898f38a0169feccb1@thread.v2
// 19:a25df31b06354644979dee9f5f0c6f13@thread.v2</textarea>
    <div class="hint">💡 Lines starting with <code>//</code> are skipped · Duplicates auto-removed</div>
  </div>

  <!-- SETTINGS -->
  <div class="card">
    <div class="card-title">⚙️ &nbsp;Settings</div>
    <div class="settings-row">
      <div class="setting-item">
        <label>Delay Between Messages (seconds)</label>
        <input type="number" id="delay" value="20" min="1" max="300"/>
      </div>
    </div>
    <div style="margin-top:16px;">
      <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;">Bearer Token</label>
      <div class="token-row">
        <input type="password" id="bearerToken" placeholder="Paste your Microsoft Graph Bearer Token here…" />
        <button class="toggle-eye" onclick="toggleToken()" title="Show/hide token">👁</button>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="card">
    <div class="card-title">🚀 &nbsp;Actions</div>
    <div class="btn-row">
      <button class="btn-send" id="sendBtn" onclick="startBroadcast()">▶ Send to All Chats</button>
      <button class="btn-cancel" id="cancelBtn" onclick="cancelBroadcast()">⛔ Cancel</button>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Preparing…</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="card">
    <div class="card-title">📋 &nbsp;Activity Log</div>
    <div id="log"><span style="color:var(--muted)">Log will appear here once you start broadcasting…</span></div>
  </div>

</div>

<script>
  // ─────────────────────────────────────────────
  //  STATE
  // ─────────────────────────────────────────────
  let cancelRequested = false;

  // ─────────────────────────────────────────────
  //  RICH TEXT FORMATTING
  // ─────────────────────────────────────────────
  function fmt(cmd) {
    document.getElementById('editor').focus();
    document.execCommand(cmd, false, null);
  }

  function applyColor(color) {
    document.getElementById('editor').focus();
    document.execCommand('foreColor', false, color);
  }

  function clearEditor() {
    document.getElementById('editor').innerHTML = '';
    document.getElementById('editor').focus();
  }

  // ─────────────────────────────────────────────
  //  @EVERYONE TAG  (Fix #4)
  //  Inserts a <at id="0">Everyone</at> tag which
  //  Teams Graph API renders as a real @Everyone mention
  // ─────────────────────────────────────────────
  function insertEveryoneTag() {
    const editor = document.getElementById('editor');
    editor.focus();

    // Visible badge in editor (cosmetic)
    const badge = document.createElement('span');
    badge.className = 'at-everyone';
    badge.contentEditable = 'false';
    badge.dataset.atEveryone = 'true';
    badge.textContent = '@Everyone';

    const sel = window.getSelection();
    if (sel.rangeCount) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(badge);
      range.setStartAfter(badge);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      editor.appendChild(badge);
    }
  }

  // ─────────────────────────────────────────────
  //  CONVERT EDITOR HTML → TEAMS-COMPATIBLE HTML  (Fix #2 & #4)
  // ─────────────────────────────────────────────
  function buildTeamsHtml() {
    // Clone so we don't mutate the live editor
    const clone = document.getElementById('editor').cloneNode(true);

    // Replace cosmetic @Everyone badges → Teams <at> tag
    clone.querySelectorAll('[data-at-everyone]').forEach(el => {
      const atTag = document.createTextNode('<at id="0">Everyone</at>');
      el.parentNode.replaceChild(atTag, el);
    });

    // Get innerHTML and fix Teams quirks:
    let html = clone.innerHTML;

    // Teams needs <br> not \n for newlines (already fine from contenteditable)
    // Inline styles are respected by Teams (bold, italic, underline, color all pass through)
    // Just make sure font tags from execCommand are kept as-is - Teams supports them.

    return html.trim() || '<p>(empty message)</p>';
  }

  // ─────────────────────────────────────────────
  //  PARSE CHAT IDs  (Fix #3)
  //  - Lines starting with // are skipped
  //  - Blank lines skipped
  //  - Duplicates removed
  // ─────────────────────────────────────────────
  function parseChatIds() {
    const raw = document.getElementById('chatIds').value;
    const seen = new Set();
    const ids = [];

    for (const line of raw.split('\n')) {
      const trimmed = line.trim();
      // Skip commented lines and blanks
      if (!trimmed || trimmed.startsWith('//')) continue;
      if (!seen.has(trimmed)) {
        seen.add(trimmed);
        ids.push(trimmed);
      }
    }
    return ids;
  }

  // ─────────────────────────────────────────────
  //  TOKEN TOGGLE
  // ─────────────────────────────────────────────
  function toggleToken() {
    const t = document.getElementById('bearerToken');
    t.type = t.type === 'password' ? 'text' : 'password';
  }

  // ─────────────────────────────────────────────
  //  CANCEL  (Fix #1)
  // ─────────────────────────────────────────────
  function cancelBroadcast() {
    cancelRequested = true;
    log('⛔ Cancel requested — will stop after current message…', 'log-stop');
    document.getElementById('cancelBtn').disabled = true;
    document.getElementById('cancelBtn').textContent = '⏳ Cancelling…';
  }

  // ─────────────────────────────────────────────
  //  LOGGING
  // ─────────────────────────────────────────────
  const logBox = () => document.getElementById('log');

  function log(msg, cls = '') {
    const box = logBox();
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function clearLog() {
    logBox().innerHTML = '';
  }

  // ─────────────────────────────────────────────
  //  PROGRESS
  // ─────────────────────────────────────────────
  function setProgress(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent =
      `${done} / ${total} chats sent  (${pct}%)`;
  }

  // ─────────────────────────────────────────────
  //  SLEEP
  // ─────────────────────────────────────────────
  const sleep = ms => new Promise(res => setTimeout(res, ms));

  // ─────────────────────────────────────────────
  //  MAIN BROADCAST  (all 4 fixes integrated)
  // ─────────────────────────────────────────────
  async function startBroadcast() {
    const token = document.getElementById('bearerToken').value.trim();
    if (!token) { alert('Please enter your Bearer Token first.'); return; }

    const chatIds = parseChatIds();
    if (!chatIds.length) { alert('No active Chat IDs found. Make sure at least one line is not commented out.'); return; }

    const delayMs = (parseInt(document.getElementById('delay').value) || 20) * 1000;
    const htmlContent = buildTeamsHtml();

    // Mention everyone payload (required when using <at> tag)
    const hasMention = htmlContent.includes('<at id="0">Everyone</at>');
    const mentionsPayload = hasMention ? [{
      id: 0,
      mentionText: "Everyone",
      mentioned: { conversation: { conversationType: "channel", id: "everyone" } }
    }] : [];

    // UI state
    cancelRequested = false;
    clearLog();
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('cancelBtn').classList.add('visible');
    document.getElementById('cancelBtn').disabled = false;
    document.getElementById('cancelBtn').textContent = '⛔ Cancel';
    document.getElementById('progressWrap').classList.add('visible');
    setProgress(0, chatIds.length);

    log(`📋 Total unique chats: ${chatIds.length}`, 'log-info');
    log(`⏱ Delay: ${delayMs / 1000}s between messages`, 'log-info');
    log(`─────────────────────────────────`);

    let sent = 0;

    for (let i = 0; i < chatIds.length; i++) {
      // ── FIX #1: Check cancel before each iteration ──
      if (cancelRequested) {
        log(`\n⛔ Broadcast cancelled by user after ${sent} message(s).`, 'log-stop');
        break;
      }

      const chatId = chatIds[i];
      log(`➤ [${i + 1}/${chatIds.length}] Sending to ${chatId}…`);

      try {
        const body = {
          body: { contentType: "html", content: htmlContent }
        };
        if (mentionsPayload.length) body.mentions = mentionsPayload;

        const res = await fetch(
          `https://graph.microsoft.com/v1.0/chats/${chatId}/messages`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
          }
        );

        if (res.ok) {
          sent++;
          log(`   ✅ Sent successfully`, 'log-ok');
        } else {
          const err = await res.json().catch(() => res.text());
          const msg = err?.error?.message || JSON.stringify(err);
          log(`   ❌ Failed: ${msg}`, 'log-err');
        }

      } catch (e) {
        log(`   ❌ Network error: ${e.message}`, 'log-err');
      }

      setProgress(sent, chatIds.length);

      // ── FIX #1: Check cancel after message, before sleep ──
      if (cancelRequested) {
        log(`\n⛔ Broadcast cancelled by user after ${sent} message(s).`, 'log-stop');
        break;
      }

      if (i < chatIds.length - 1) {
        log(`   ⏳ Waiting ${delayMs / 1000}s…`, 'log-wait');
        // Sleep in small chunks so cancel is responsive
        const chunks = Math.ceil(delayMs / 500);
        for (let c = 0; c < chunks; c++) {
          if (cancelRequested) break;
          await sleep(500);
        }
      }
    }

    if (!cancelRequested) {
      log(`\n🎉 Done! ${sent}/${chatIds.length} messages sent successfully.`, 'log-done');
    }

    // Reset UI
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('cancelBtn').classList.remove('visible');
    document.getElementById('cancelBtn').disabled = false;
    document.getElementById('cancelBtn').textContent = '⛔ Cancel';
    cancelRequested = false;
  }
</script>

</body>
</html>
